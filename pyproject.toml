[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssap-mcp"
version = "0.1.0"
description = "MCP server that drives SSAP2010 (Slope Stability Analysis Program) for automated LEM slope stability verification"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Guido Carieri" }]
keywords = ["mcp", "ssap", "slope-stability", "geotechnics", "lem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp[cli]>=1.12.2",
    "ezdxf>=1.3.0",
    "numpy",
    "laspy[laszip]",
    "matplotlib>=3.10.9",
]

[project.urls]
Homepage = "https://github.com/guidocarieri/ssap-mcp"
"SSAP (by Prof. Lorenzo Borselli)" = "https://www.ssap.eu"

[project.scripts]
ssap-mcp = "ssap_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ssap_mcp"]
